<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Test</title>
<style>
  :root{
    --bg:#1a1a1a; --card:#2a2a2a; --panel:#1f1f1f; --border:#3a3a3a;
    --text:#f2efe8; --muted:#a9a69e; --blue:#6a9fd8; --orange:#e0735a;
    --green:#4ade80; --green-bg:#0f2a17; --green-bd:#1f5a30; --miss-bg:#2e1b17; --miss-bd:#5a2f26;
    --heading:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;justify-content:center;padding:48px 16px}
  main{width:100%;max-width:590px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;min-height:200px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h2{font-family:var(--heading);font-weight:400;font-size:24px;letter-spacing:-.01em;margin:0 0 10px}
  p{margin:0 0 24px;color:var(--muted);max-width:480px}
  button{font:inherit;font-weight:600;border:0;border-radius:999px;background:#fff;color:#111;padding:14px 40px;cursor:pointer}
  button:hover{opacity:.9}
  .word{font-family:var(--heading);font-size:44px;letter-spacing:-.01em;min-height:60px}
  .counter{color:var(--muted);font-size:14px;margin-top:8px}
  .label{color:var(--muted);margin-bottom:12px}
  textarea{width:100%;max-width:400px;height:82px;background:#111;color:var(--text);border:1px solid var(--border);
           border-radius:8px;padding:12px;font:inherit;resize:vertical;outline:none;margin-bottom:14px}
  textarea:focus{border-color:#35507a}
  .full{width:100%;max-width:400px}
  .score{font-family:var(--heading);font-size:24px;margin-bottom:14px}
  .score b{color:var(--blue);font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
  .chip{font-size:14px;border-radius:999px;padding:2px 12px;border:1px solid}
  .chip i{font-style:normal;font-size:10px;opacity:.7;margin-right:4px}
  .chip.hit{color:var(--green);background:var(--green-bg);border-color:var(--green-bd)}
  .chip.miss{color:var(--orange);background:var(--miss-bg);border-color:var(--miss-bd);text-decoration:line-through;text-decoration-color:#7a3d30}
  .chart{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px 24px 16px;margin-bottom:16px}
  .chart h3{margin:0 0 14px;font-size:11px;letter-spacing:.08em;font-weight:500;color:var(--muted);text-transform:uppercase}
  .bars{display:flex;gap:4px;height:60px;align-items:flex-end}
  .bar{flex:1;background:var(--blue);border-radius:6px 6px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1);height:0}
  .bar.miss{background:#444;opacity:.6}
  .nums{display:flex;gap:4px;margin-top:6px}
  .nums span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
  .grad{height:4px;border-radius:2px;margin-top:8px;background:linear-gradient(90deg,var(--blue),#33415a 30%,#333 50%,#33415a 70%,var(--blue))}
  .legend{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
  .insight{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px;text-align:left;margin-bottom:16px}
  .insight p{color:var(--text);margin:0;max-width:none}
  .insight hr{border:0;border-top:1px solid var(--border);margin:14px 0}
  .insight .warn{color:var(--orange)}
  .insight em{font-style:normal;color:var(--blue)}
  .replay{background:none;color:var(--muted);font-size:11px;font-weight:400;text-decoration:underline;padding:4px;border-radius:0}
  .stats{font-size:12px;color:var(--muted);margin-bottom:12px}
</style>
</head>
<body>
<main><section class="card" id="stage"></section></main>

<script>
/* ---------- config (khớp bản gốc: 15 từ, 1.5s/từ, nhịp ~1.8s, "Done!" ~0.6s) ---------- */
const CFG = { count: 15, showMs: 1500, gapMs: 300, doneMs: 600 };
const POOL = ["bridge","candle","marble","forest","hammer","silver","pencil","garden","thunder","mirror",
  "copper","blanket","village","rocket","feather","anchor","ladder","orchard","compass","lantern",
  "pebble","violin","harbor","saddle","meadow","kettle","tunnel","button","canyon","whistle"];

const $ = document.getElementById('stage');
let words = [];

const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- screens ---------- */
function intro(){
  $.innerHTML = `
    <h2>Memory Test</h2>
    <p>You’ll see ${CFG.count} words, one at a time. Each appears for about ${CFG.showMs/1000} seconds. Try to remember as many as you can.</p>
    <button id="go">Show the Words</button>`;
  document.getElementById('go').onclick = present;
}

async function present(){
  words = shuffle(POOL).slice(0, CFG.count);
  $.innerHTML = `<div class="word" id="w"></div><div class="counter" id="c"></div>`;
  const w = document.getElementById('w'), c = document.getElementById('c');
  for (let i=0;i<words.length;i++){
    w.textContent = words[i]; c.textContent = `${i+1} of ${CFG.count}`;
    await sleep(CFG.showMs);
    w.textContent = ''; await sleep(CFG.gapMs);
  }
  w.textContent = 'Done!'; c.textContent = '';
  await sleep(CFG.doneMs);
  recall();
}

function recall(){
  $.innerHTML = `
    <div class="label">Type the words you remember, separated by commas or spaces.</div>
    <textarea id="ta" class="full" placeholder="Type the words you remember here..."></textarea>
    <button id="chk" class="full">Check My Memory</button>`;
  const ta = document.getElementById('ta'); ta.focus();
  document.getElementById('chk').onclick = () => results(ta.value);
}

function results(raw){
  const typed = new Set(raw.toLowerCase().split(/[\s,;]+/).map(s=>s.replace(/[^a-z]/g,'')).filter(Boolean));
  const hit = words.map(w => typed.has(w));
  const n = hit.filter(Boolean).length;
  const third = Math.floor(CFG.count/3);
  const avg = (a,b) => { const s=hit.slice(a,b); return s.length ? Math.round(100*s.filter(Boolean).length/s.length) : 0; };

  $.innerHTML = `
    <div class="score">You recalled <b>${n}</b> of ${CFG.count}</div>
    <div class="chips">${words.map((w,i)=>`<span class="chip ${hit[i]?'hit':'miss'}"><i>${i+1}</i>${w}</span>`).join('')}</div>
    <div class="chart">
      <h3>Serial position — your recall pattern</h3>
      <div class="bars">${hit.map(h=>`<div class="bar ${h?'':'miss'}" data-h="${h?100:12}"></div>`).join('')}</div>
      <div class="nums">${words.map((_,i)=>`<span>${i+1}</span>`).join('')}</div>
      <div class="grad"></div>
      <div class="legend"><span>Most likely</span><span>Least likely</span><span>Most likely</span></div>
    </div>
    <div class="stats">Beginning ${avg(0,third)}% · Middle ${avg(third,CFG.count-third)}% · End ${avg(CFG.count-third,CFG.count)}%</div>
    <div class="insight">
      <p>The words you remembered likely cluster at the <em>beginning</em> and <em>end</em> of the list. The middle gets lost. This is the <em>primacy–recency effect</em> — and LLMs show the same bias.</p>
      <hr>
      <p class="warn">Instructions at the start and end of a context window get followed. The middle gets buried. This is why more context ≠ better results — and why “Lost in the Middle” (Liu et al., 2023) found accuracy drops of 30%+ when key facts land in the center of long contexts.</p>
    </div>
    <button class="replay" id="re">Replay words (defeats the exercise)</button>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>
    document.querySelectorAll('.bar').forEach(b=>b.style.height=b.dataset.h+'%')));
  document.getElementById('re').onclick = () => replay();
}

async function replay(){
  const saved = words;
  $.innerHTML = `<div class="word" id="w"></div><div class="counter" id="c"></div>`;
  const w = document.getElementById('w'), c = document.getElementById('c');
  for (let i=0;i<saved.length;i++){ w.textContent=saved[i]; c.textContent=`${i+1} of ${CFG.count}`; await sleep(CFG.showMs); w.textContent=''; await sleep(CFG.gapMs); }
  w.textContent='Done!'; await sleep(CFG.doneMs); recall();
}

intro();
</script>
</body>
</html>
